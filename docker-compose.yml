services:
  db:
    image: postgres:15
    container_name: aria-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-aria_ai}
      # Keep the cluster in a subdirectory so the named volume's mount point
      # does not collide with initdb on first boot.
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-aria_ai}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Uncomment once backend/Dockerfile exists. Note DATABASE_URL uses the `db`
  # service name as host, not localhost, when the API runs inside the network.
  # backend:
  #   build: ./backend
  #   container_name: aria-backend
  #   restart: unless-stopped
  #   env_file: ./backend/.env
  #   environment:
  #     DATABASE_URL: postgresql://postgres:password@db:5432/aria_ai
  #   ports:
  #     - "8000:8000"
  #   depends_on:
  #     db:
  #       condition: service_healthy

volumes:
  postgres_data:
    driver: local
